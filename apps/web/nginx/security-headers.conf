# Security headers for every web app response (NFR1.14; security-design.md).
# Included in EVERY location that serves the web app: a location with its own
# add_header drops the server-level ones. `always` keeps them on error pages.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy same-origin always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
