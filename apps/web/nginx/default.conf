# Mojud web server (infrastructure-specification.md).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker health check for the web container.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # The API keeps its own headers (helmet); nothing is added here.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build files: cache for a year.
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Not hashed: always revalidate.
  location = /theme-init.js {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # Client-side routes fall back to index.html.
  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
